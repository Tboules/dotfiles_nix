onboarding = false
[keys]
prefix = "ctrl+a"
# Settings moved off prefix+s; the tmux-style jump popup below takes its place.
settings = "prefix+shift+s"

# One-keystroke jump picker (tmux prefix+s style): popup listing spaces on
# 1-9 and agents on shift+1-9; a single keypress focuses the target and
# closes the popup. Plugin lives at herdr-plugins/jump in this repo
# (registered via `herdr plugin link`).
[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "tboules.jump.open"
description = "jump to space/agent"

# Ctrl+h/j/k/l navigate Vim splits while Vim is focused, and fall through to
# herdr panes at edges (via the vim-herdr-navigation plugin).
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[theme]
name = 'terminal'

[ui]
sidebar_collapsed_mode = 'hidden'
sidebar_start_collapsed = true
pane_gaps = false

[keys.indexed]
agents = "alt"
