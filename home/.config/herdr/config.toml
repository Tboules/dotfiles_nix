onboarding = false
[keys]
prefix = "ctrl+a"

# Ctrl+h/j/k/l navigate Vim splits while Vim is focused, and fall through to
# herdr panes at edges (via the vim-herdr-navigation plugin).
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[theme]
name = 'terminal'

[ui]
sidebar_collapsed_mode = 'hidden'
sidebar_start_collapsed = true
pane_gaps = false

[keys.indexed]
agents = "alt"
